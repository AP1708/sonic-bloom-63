name: Android release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build offline fallback bundle
        run: |
          mkdir -p dist-android
          cat > dist-android/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>IMUSIC</title>
          <style>
            html,body{height:100%;margin:0;background:#0A0A0B;color:#F5F5F4;
              font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;text-align:center}
            p{opacity:.7;font-size:14px;max-width:22rem;padding:0 1.5rem}
            h1{font-size:20px;letter-spacing:-.02em}
          </style></head>
          <body><div><h1>IMUSIC</h1><p>You're offline. Reconnect to keep listening.</p></div></body></html>
          HTML

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Create native Android project
        run: bunx cap add android

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/imusic-release.keystore"
            echo "path=$RUNNER_TEMP/imusic-release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK will be unsigned."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure version and signing
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: node scripts/android-configure.mjs "${{ steps.version.outputs.version }}"

      - name: Sync web assets
        run: bunx cap sync android

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signatures and rename per-ABI builds
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p release-assets
          NOTES=""
          FOUND=0
          for APK in $(find android/app/build/outputs/apk/release -name "*.apk" | sort); do
            BASE=$(basename "$APK" | tr '[:upper:]' '[:lower:]')
            case "$BASE" in
              *arm64-v8a*)   ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *x86_64*)      ABI="x86_64" ;;
              *)             ABI="universal" ;;
            esac
            OUT="release-assets/imusic-$VERSION-$ABI.apk"
            cp "$APK" "$OUT"
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
            fi
            SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
            NOTES="$NOTES- \`$(basename "$OUT")\` — SHA-256: \`$SHA\`\n"
            FOUND=$((FOUND + 1))
          done
          if [ "$FOUND" -eq 0 ]; then echo "No APK produced"; exit 1; fi
          {
            echo "notes<<EOF"
            printf "%b" "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: imusic-${{ steps.version.outputs.version }}-apks
          path: release-assets/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: IMUSIC ${{ steps.version.outputs.version }}
          files: release-assets/*.apk
          body: |
            ### IMUSIC ${{ steps.version.outputs.version }} for Android

            Pick the build for your phone — the download page selects it automatically.
            `arm64-v8a` fits nearly every phone from 2016 onwards; `universal` works everywhere.

            ${{ steps.apk.outputs.notes }}

